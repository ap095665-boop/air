<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Hall of Flames</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}

/* =========================================
   FULL SCREEN
========================================= */

.page {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100dvh;

    overflow: hidden;

    background: #000;
}


/* =========================================
   VIDEO
========================================= */

#introVideo {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    z-index: 100;

    background: #000;
}


/*
   During the first 0.06 seconds:
   ONLY the video is visible.
*/


/* =========================================
   HALL CONTENT
========================================= */

#hall {

    position: fixed;

    inset: 0;

    display: flex;

    flex-direction: column;
    align-items: center;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transform: scale(1.03);

    transition:
        opacity .7s ease,
        transform .7s ease;

    z-index: 10;
}


#hall.show {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;

    transform: scale(1);

}


/* =========================================
   HALL BACKGROUND
========================================= */

.hall-background {

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,90,0,.20),
            transparent 45%
        ),
        linear-gradient(
            180deg,
            #160400,
            #050505 55%,
            #090000
        );

    z-index: -5;
}


/* =========================================
   AMBIENT LIGHTS
========================================= */

.light {

    position: absolute;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    filter: blur(50px);

    opacity: .35;

    pointer-events: none;

    animation: floatingLight 7s ease-in-out infinite alternate;
}

.light.one {

    background: #ff3c00;

    left: -70px;
    top: 15%;
}

.light.two {

    background: #ff00aa;

    right: -80px;
    top: 45%;

    animation-delay: 2s;
}

.light.three {

    background: #00d9ff;

    left: 30%;
    bottom: -100px;

    animation-delay: 4s;
}


@keyframes floatingLight {

    from {
        transform: translate(0,0) scale(.8);
    }

    to {
        transform: translate(35px,-40px) scale(1.3);
    }

}


/* =========================================
   HEADER
========================================= */

.header {

    position: relative;

    flex-shrink: 0;

    width: 100%;

    padding:
        max(22px, env(safe-area-inset-top))
        15px
        12px;

    text-align: center;
}


.title {

    margin: 0;

    font-size:
        clamp(28px, 9vw, 64px);

    font-weight: 1000;

    letter-spacing: 4px;

    background:
        linear-gradient(
            90deg,
            #ff3000,
            #ffd000,
            #ff5b00,
            #ff00c8,
            #00eaff,
            #ff3000
        );

    background-size: 400% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        gradientMove 5s linear infinite,
        titleGlow 1.5s ease-in-out infinite alternate;
}


@keyframes gradientMove {

    to {
        background-position: 400% center;
    }

}


@keyframes titleGlow {

    from {
        filter:
            drop-shadow(
                0 0 5px rgba(255,70,0,.4)
            );
    }

    to {
        filter:
            drop-shadow(
                0 0 22px rgba(255,70,0,.95)
            );
    }

}


.subtitle {

    margin-top: 5px;

    color: rgba(255,255,255,.7);

    font-size: 10px;

    letter-spacing: 3px;

    text-transform: uppercase;
}


/* =========================================
   GLASS NAME AREA
========================================= */

.glass {

    position: relative;

    width: min(94%, 1000px);

    flex: 1;

    min-height: 0;

    margin:
        5px auto
        14px;

    border-radius: 28px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.035)
        );

    border:
        1px solid rgba(255,255,255,.22);

    box-shadow:

        0 25px 70px
        rgba(0,0,0,.55),

        inset 0 1px
        rgba(255,255,255,.18);

    backdrop-filter: blur(16px);

    -webkit-backdrop-filter: blur(16px);

    overflow: hidden;
}


/* animated border */

.glass::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    padding: 1px;

    background:
        linear-gradient(
            120deg,
            transparent,
            #ff5100,
            transparent,
            #00eaff,
            transparent,
            #ff00aa,
            transparent
        );

    background-size: 400% 400%;

    animation:
        borderAnimation 7s linear infinite;

    pointer-events: none;

    mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    mask-composite: exclude;

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite: xor;
}


@keyframes borderAnimation {

    to {
        background-position: 400% 400%;
    }

}


/* =========================================
   NAME GRID
========================================= */

.name-grid {

    position: absolute;

    inset: 0;

    padding: 14px;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    align-content: start;

    gap: 9px;

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: thin;
}


/* Tablet */

@media (min-width: 600px) {

    .name-grid {

        grid-template-columns:
            repeat(3, minmax(0, 1fr));
    }

}


/* Desktop */

@media (min-width: 900px) {

    .name-grid {

        grid-template-columns:
            repeat(4, minmax(0, 1fr));
    }

}


/* =========================================
   NAME CARD
========================================= */

.name-card {

    min-height: 58px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 10px;

    border-radius: 16px;

    border:
        1px solid
        rgba(255,255,255,.2);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.17),
            rgba(255,255,255,.045)
        );

    color: white;

    font-size:
        clamp(12px, 3.5vw, 18px);

    font-weight: 800;

    text-align: center;

    text-shadow:
        0 0 7px currentColor,
        0 0 18px currentColor;

    box-shadow:
        inset 0 1px
        rgba(255,255,255,.15),

        0 7px 18px
        rgba(0,0,0,.25);

    opacity: 0;

    animation:
        nameAppear .5s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


@keyframes nameAppear {

    0% {

        opacity: 0;

        transform:
            scale(.45)
            translateY(20px);

        filter: blur(12px);
    }

    60% {

        opacity: 1;

        transform:
            scale(1.08)
            translateY(-2px);

        filter: blur(0);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }

}


/* =========================================
   NAME COLOURS
========================================= */

.name-card:nth-child(5n+1) {
    color: #ffd43b;
}

.name-card:nth-child(5n+2) {
    color: #ff7043;
}

.name-card:nth-child(5n+3) {
    color: #ff4dd8;
}

.name-card:nth-child(5n+4) {
    color: #42e8ff;
}

.name-card:nth-child(5n+5) {
    color: #9cff63;
}


/* =========================================
   SCROLLBAR
========================================= */

.name-grid::-webkit-scrollbar {
    width: 5px;
}

.name-grid::-webkit-scrollbar-track {
    background: transparent;
}

.name-grid::-webkit-scrollbar-thumb {

    background:
        rgba(255,255,255,.35);

    border-radius: 20px;
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 480px) {

    .glass {

        width: 94%;

        border-radius: 23px;

        margin-bottom: 10px;
    }

    .name-grid {

        padding: 11px;

        gap: 8px;
    }

    .name-card {

        min-height: 54px;

        border-radius: 14px;
    }

}


/* =========================================
   HIDE HALL DURING INTRO
========================================= */

body.intro {

    background: #000;
}


/*
   When intro finishes,
   video is removed from view.
*/

body.finished #introVideo {

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition: opacity .25s ease;
}

</style>
</head>


<body class="intro">


<div class="page">


    <!-- =====================================
         INTRO VIDEO

         NO UI IS SHOWN DURING THIS
    ====================================== -->

    <video
        id="introVideo"

        autoplay
        muted
        playsinline

        preload="auto"

        src="https://ap095665-boop.github.io/air/587068603_1786301278413516.mp4">
    </video>



    <!-- =====================================
         HALL OF FLAMES
    ====================================== -->

    <section id="hall">


        <div class="hall-background"></div>


        <div class="light one"></div>
        <div class="light two"></div>
        <div class="light three"></div>



        <header class="header">

            <h1 class="title">
                HALL OF FLAMES
            </h1>

            <div class="subtitle">
                Every name becomes a flame
            </div>

        </header>



        <div class="glass">

            <div
                id="nameGrid"
                class="name-grid">
            </div>

        </div>


    </section>

</div>



<script>

/* =========================================
   YOUR NAMES
========================================= */

const names = [

    "Amal",
    "Arjun",
    "David",
    "Daniel",
    "Joseph",
    "Michael",
    "Thomas",
    "John",
    "Peter",
    "Samuel",
    "Anthony",
    "Christopher",
    "Matthew",
    "James",
    "Benjamin",
    "Andrew",
    "Joshua",
    "Ryan",
    "Kevin",
    "Alex",
    "George",
    "William",
    "Robert",
    "Edward",
    "Henry",
    "Charles",
    "Oliver",
    "Lucas",
    "Noah",
    "Ethan",
    "Liam",
    "Mason",
    "Jack",
    "Leo",
    "Oscar",
    "Nathan",
    "Adam",
    "Jacob",
    "Isaac"

    /* ADD ALL YOUR OTHER NAMES HERE */

];



/* =========================================
   ELEMENTS
========================================= */

const video =
    document.getElementById("introVideo");

const hall =
    document.getElementById("hall");

const grid =
    document.getElementById("nameGrid");



/* =========================================
   IMPORTANT:
   0.06 SECOND INTRO
========================================= */

const INTRO_TIME = 0.06;



/* =========================================
   SHOW HALL
========================================= */

function showHall() {

    if (
        document.body.classList.contains(
            "finished"
        )
    ) {
        return;
    }


    /*
       Stop video completely.
    */

    video.pause();


    /*
       Make sure it never loops.
    */

    video.removeAttribute("loop");


    /*
       Hide video.
    */

    document.body.classList.remove("intro");

    document.body.classList.add("finished");


    /*
       Show Hall of Flames.
    */

    hall.classList.add("show");


    /*
       Now display names.
    */

    displayNames();

}



/* =========================================
   DISPLAY ALL NAMES
========================================= */

function displayNames() {

    /*
       Names are NOT created while
       the intro video is visible.

       They start only AFTER 0.06s.
    */

    names.forEach(
        (name, index) => {

            const card =
                document.createElement("div");

            card.className =
                "name-card";

            card.textContent =
                name;


            /*
               Tiny stagger purely for
               the entrance animation.
            */

            card.style.animationDelay =
                `${index * 0.025}s`;


            grid.appendChild(card);

        }
    );

}



/* =========================================
   START INTRO
========================================= */

function startIntro() {

    /*
       Make absolutely sure video
       starts from beginning.
    */

    video.currentTime = 0;


    /*
       Video should NOT loop.
    */

    video.loop = false;


    /*
       Play video.

       NOTE:
       Browsers generally block autoplay
       with sound. The video is therefore
       initially muted for autoplay.
    */

    video.muted = true;

    video.play().catch(() => {

        /*
           If browser blocks playback,
           wait for user interaction.
        */

        const start =
            () => {

                video.muted = false;

                video.play();

                document.removeEventListener(
                    "touchstart",
                    start
                );

                document.removeEventListener(
                    "click",
                    start
                );

            };


        document.addEventListener(
            "touchstart",
            start,
            { once: true }
        );

        document.addEventListener(
            "click",
            start,
            { once: true }
        );

    });


    /*
       Wait exactly 0.06 seconds.
    */

    setTimeout(
        showHall,
        INTRO_TIME * 1000
    );

}



/* =========================================
   START
========================================= */

if (
    document.readyState ===
    "loading"
) {

    document.addEventListener(
        "DOMContentLoaded",
        startIntro
    );

} else {

    startIntro();

}

</script>

</body>
</html>
