<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Hall of Flames</title>

<style>

/* ==================================================
   RESET
================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}


/* ==================================================
   MAIN PAGE
================================================== */

#page {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    background: #000;
}


/* ==================================================
   INTRO VIDEO

   THIS IS THE ONLY THING VISIBLE
   DURING THE FIRST 0.06 SECOND
================================================== */

#introVideo {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    z-index: 100;

    opacity: 1;
    visibility: visible;

    pointer-events: none;
}


/* ==================================================
   TAP SCREEN

   Only appears if browser blocks
   autoplay with sound.
================================================== */

#startScreen {

    position: fixed;
    inset: 0;

    z-index: 200;

    display: none;

    align-items: center;
    justify-content: center;

    background: #000;

    color: white;

    text-align: center;
}

#startButton {

    border: 1px solid rgba(255,255,255,.3);

    border-radius: 20px;

    padding: 18px 28px;

    color: white;

    background:
        linear-gradient(
            135deg,
            rgba(255,80,0,.25),
            rgba(255,0,180,.15)
        );

    backdrop-filter: blur(15px);

    font-size: 16px;

    font-weight: 800;

    letter-spacing: 2px;

    box-shadow:
        0 0 30px rgba(255,70,0,.3);

    cursor: pointer;
}


/* ==================================================
   HALL

   IMPORTANT:
   COMPLETELY HIDDEN AT START
================================================== */

#hall {

    position: fixed;
    inset: 0;

    width: 100%;
    height: 100dvh;

    display: flex;

    flex-direction: column;
    align-items: center;

    opacity: 0;
    visibility: hidden;

    pointer-events: none;

    z-index: 10;

    transition:
        opacity .45s ease,
        visibility .45s ease;
}


/* ==================================================
   HALL IS SHOWN ONLY AFTER 0.06s
================================================== */

#hall.visible {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* ==================================================
   HALL BACKGROUND
================================================== */

.hall-bg {

    position: absolute;
    inset: 0;

    background:

        radial-gradient(
            circle at 50% 15%,
            rgba(255,80,0,.22),
            transparent 42%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(255,0,170,.12),
            transparent 40%
        ),

        linear-gradient(
            180deg,
            #180400,
            #050505 55%,
            #090000
        );

    z-index: -10;
}


/* ==================================================
   FLOATING LIGHTS
================================================== */

.light {

    position: absolute;

    width: 180px;
    height: 180px;

    border-radius: 50%;

    filter: blur(60px);

    opacity: .3;

    pointer-events: none;

    animation:
        floatLight 7s ease-in-out infinite alternate;
}

.light1 {

    left: -80px;
    top: 15%;

    background: #ff4200;
}

.light2 {

    right: -80px;
    top: 45%;

    background: #ff00b7;

    animation-delay: 2s;
}

.light3 {

    left: 30%;
    bottom: -100px;

    background: #00dfff;

    animation-delay: 4s;
}


@keyframes floatLight {

    from {
        transform:
            translate(0,0)
            scale(.8);
    }

    to {
        transform:
            translate(40px,-40px)
            scale(1.35);
    }
}


/* ==================================================
   HEADER
================================================== */

.header {

    width: 100%;

    flex-shrink: 0;

    padding:
        max(20px, env(safe-area-inset-top))
        15px
        10px;

    text-align: center;
}


.title {

    margin: 0;

    font-size:
        clamp(27px, 9vw, 64px);

    font-weight: 1000;

    letter-spacing: 4px;

    background:

        linear-gradient(
            90deg,

            #ff2d00,
            #ffd000,
            #ff5900,
            #ff00c8,
            #00eaff,
            #ff2d00
        );

    background-size: 400% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        titleGradient 5s linear infinite,
        titleGlow 1.5s ease-in-out infinite alternate;
}


@keyframes titleGradient {

    to {
        background-position: 400% center;
    }
}


@keyframes titleGlow {

    from {
        filter:
            drop-shadow(
                0 0 5px
                rgba(255,60,0,.4)
            );
    }

    to {
        filter:
            drop-shadow(
                0 0 22px
                rgba(255,70,0,1)
            );
    }
}


.subtitle {

    margin-top: 5px;

    color:
        rgba(255,255,255,.7);

    font-size: 10px;

    letter-spacing: 3px;

    text-transform: uppercase;
}


/* ==================================================
   GLASS CONTAINER
================================================== */

.glass {

    position: relative;

    width: min(94%, 1000px);

    flex: 1;

    min-height: 0;

    margin:
        5px auto 12px;

    border-radius: 27px;

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.14),
            rgba(255,255,255,.035)
        );

    border:
        1px solid
        rgba(255,255,255,.22);

    box-shadow:

        0 25px 70px
        rgba(0,0,0,.55),

        inset 0 1px
        rgba(255,255,255,.18);

    backdrop-filter: blur(16px);

    -webkit-backdrop-filter: blur(16px);

    overflow: hidden;
}


/* ==================================================
   ANIMATED GLASS BORDER
================================================== */

.glass::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    padding: 1px;

    background:

        linear-gradient(
            120deg,

            transparent,
            #ff4b00,
            transparent,
            #00eaff,
            transparent,
            #ff00b7,
            transparent
        );

    background-size: 400% 400%;

    animation:
        borderMove 7s linear infinite;

    pointer-events: none;

    mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    mask-composite: exclude;

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite: xor;
}


@keyframes borderMove {

    to {
        background-position:
            400% 400%;
    }
}


/* ==================================================
   NAME GRID
================================================== */

#nameGrid {

    position: absolute;

    inset: 0;

    padding: 13px;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    align-content: start;

    gap: 9px;

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: thin;
}


/* ==================================================
   TABLET
================================================== */

@media (min-width: 600px) {

    #nameGrid {

        grid-template-columns:
            repeat(3, minmax(0,1fr));
    }
}


/* ==================================================
   DESKTOP
================================================== */

@media (min-width: 900px) {

    #nameGrid {

        grid-template-columns:
            repeat(4, minmax(0,1fr));
    }
}


/* ==================================================
   NAME CARD
================================================== */

.name {

    min-height: 57px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 10px;

    border-radius: 16px;

    border:
        1px solid
        rgba(255,255,255,.2);

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.17),
            rgba(255,255,255,.04)
        );

    font-size:
        clamp(12px,3.5vw,18px);

    font-weight: 800;

    text-align: center;

    text-shadow:
        0 0 7px currentColor,
        0 0 17px currentColor;

    box-shadow:

        inset 0 1px
        rgba(255,255,255,.16),

        0 7px 18px
        rgba(0,0,0,.25);

    opacity: 0;

    animation:
        nameIn .5s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


@keyframes nameIn {

    0% {

        opacity: 0;

        transform:
            scale(.45)
            translateY(18px);

        filter: blur(12px);
    }

    60% {

        opacity: 1;

        transform:
            scale(1.08)
            translateY(-2px);

        filter: blur(0);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }
}


/* ==================================================
   COLOUR ROTATION
================================================== */

.name:nth-child(5n+1) {
    color: #ffd43b;
}

.name:nth-child(5n+2) {
    color: #ff7043;
}

.name:nth-child(5n+3) {
    color: #ff4bd8;
}

.name:nth-child(5n+4) {
    color: #42e8ff;
}

.name:nth-child(5n+5) {
    color: #9cff63;
}


/* ==================================================
   SCROLLBAR
================================================== */

#nameGrid::-webkit-scrollbar {
    width: 5px;
}

#nameGrid::-webkit-scrollbar-track {
    background: transparent;
}

#nameGrid::-webkit-scrollbar-thumb {

    background:
        rgba(255,255,255,.35);

    border-radius: 20px;
}


/* ==================================================
   SMALL MOBILE
================================================== */

@media (max-width:480px) {

    .glass {

        width: 94%;

        border-radius: 23px;
    }

    #nameGrid {

        padding: 10px;

        gap: 8px;
    }

    .name {

        min-height: 53px;

        border-radius: 14px;
    }
}

</style>
</head>


<body>


<div id="page">


    <!-- =================================================
         INTRO VIDEO

         NOTHING ELSE IS VISIBLE
         DURING THE FIRST 0.06 SECOND
    ================================================== -->

    <video
        id="introVideo"
        playsinline
        preload="auto"
        src="https://ap095665-boop.github.io/air/587068603_1786301278413516.mp4">
    </video>


    <!-- =================================================
         FALLBACK TAP SCREEN
    ================================================== -->

    <div id="startScreen">

        <button id="startButton">
            🔥 TAP TO ENTER
        </button>

    </div>


    <!-- =================================================
         HALL OF FLAMES

         COMPLETELY HIDDEN INITIALLY
    ================================================== -->

    <section id="hall">

        <div class="hall-bg"></div>

        <div class="light light1"></div>
        <div class="light light2"></div>
        <div class="light light3"></div>


        <header class="header">

            <h1 class="title">
                HALL OF FLAMES
            </h1>

            <div class="subtitle">
                Every name becomes a flame
            </div>

        </header>


        <div class="glass">

            <div id="nameGrid"></div>

        </div>

    </section>

</div>


<script>

/* ==================================================
   NAMES

   REPLACE THESE WITH YOUR REAL NAMES
================================================== */

const names = [

    "Amal",
    "Arjun",
    "David",
    "Daniel",
    "Joseph",
    "Michael",
    "Thomas",
    "John",
    "Peter",
    "Samuel",
    "Anthony",
    "Christopher",
    "Matthew",
    "James",
    "Benjamin",
    "Andrew",
    "Joshua",
    "Ryan",
    "Kevin",
    "Alex",
    "George",
    "William",
    "Robert",
    "Edward",
    "Henry",
    "Charles",
    "Oliver",
    "Lucas",
    "Noah",
    "Ethan",
    "Liam",
    "Mason",
    "Jack",
    "Leo",
    "Oscar",
    "Nathan",
    "Adam",
    "Jacob",
    "Isaac"

    // ADD MORE NAMES HERE

];


/* ==================================================
   ELEMENTS
================================================== */

const video =
    document.getElementById(
        "introVideo"
    );

const hall =
    document.getElementById(
        "hall"
    );

const grid =
    document.getElementById(
        "nameGrid"
    );

const startScreen =
    document.getElementById(
        "startScreen"
    );

const startButton =
    document.getElementById(
        "startButton"
    );


/* ==================================================
   EXACT INTRO DURATION

   0.06 SECOND
================================================== */

const INTRO_DURATION = 6000;


/* ==================================================
   PREVENT DOUBLE START
================================================== */

let started = false;
let finished = false;


/* ==================================================
   SHOW NAMES
================================================== */

function showNames() {

    if (finished) return;

    finished = true;


    /*
       STOP VIDEO
    */

    video.pause();

    video.loop = false;


    /*
       Remove video completely
       from the visual layer.
    */

    video.style.opacity = "0";
    video.style.visibility = "hidden";


    /*
       Show Hall ONLY NOW.
    */

    hall.classList.add("visible");


    /*
       Create names ONLY NOW.
    */

    grid.innerHTML = "";


    names.forEach(
        (name, index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className = "name";

            card.textContent = name;


            /*
               Stagger the visual
               entrance slightly.
            */

            card.style.animationDelay =
                `${index * 0.025}s`;


            grid.appendChild(card);

        }
    );

}


/* ==================================================
   START THE 0.06 SECOND VIDEO
================================================== */

function startVideoSequence() {

    if (started) return;

    started = true;

    startScreen.style.display =
        "none";


    /*
       Start exactly from beginning.
    */

    video.currentTime = 0;


    /*
       NEVER LOOP.
    */

    video.loop = false;


    /*
       Sound ON.
    */

    video.muted = false;

    video.volume = 1;


    /*
       Start video.
    */

    const promise =
        video.play();


    /*
       If browser allows sound autoplay,
       video starts immediately.
    */

    if (promise !== undefined) {

        promise.catch(() => {

            /*
               Browser blocked
               autoplay with sound.

               Show tap button.
            */

            started = false;

            startScreen.style.display =
                "flex";

        });

    }


    /*
       IMPORTANT:

       Only after 60ms do we
       reveal the Hall.

       Before this point:
       NO glass.
       NO names.
       NO title.
    */

    setTimeout(
        showNames,
        INTRO_DURATION
    );

}


/* ==================================================
   TAP BUTTON
================================================== */

startButton.addEventListener(
    "click",
    startVideoSequence
);


/* ==================================================
   TRY AUTOPLAY WITH SOUND
================================================== */

window.addEventListener(
    "load",
    () => {

        video.muted = false;

        video.volume = 1;

        video.currentTime = 0;

        video.loop = false;


        const promise =
            video.play();


        if (
            promise !== undefined
        ) {

            promise.catch(() => {

                /*
                   Autoplay with sound
                   was blocked.

                   Nothing except the
                   tap screen is shown.
                */

                startScreen.style.display =
                    "flex";

            });

        }

    }
);

</script>

</body>
</html>
