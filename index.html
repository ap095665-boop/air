<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Hall of Flames</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   PAGE
===================================================== */

.page {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100dvh;

    overflow: hidden;
    background: #000;
}


/* =====================================================
   BACKGROUND VIDEO

   VIDEO ALWAYS REMAINS BEHIND THE HALL
===================================================== */

#bgVideo {

    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    z-index: 1;

    pointer-events: none;
}


/* =====================================================
   VIDEO DARKENING

   HIDDEN DURING FIRST 6 SECONDS
===================================================== */

.videoShade {

    position: fixed;
    inset: 0;

    z-index: 2;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.18),
            rgba(0,0,0,.58)
        );

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 2.5s ease;
}

.videoShade.active {
    opacity: 1;
}


/* =====================================================
   TAP TO START

   ONLY SHOWN IF AUTOPLAY WITH SOUND IS BLOCKED
===================================================== */

#startScreen {

    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    background: #000;

    color: #fff;

    text-align: center;
}


.startButton {

    border: 1px solid
        rgba(255,255,255,.3);

    border-radius: 20px;

    padding: 18px 30px;

    color: white;

    background:
        linear-gradient(
            135deg,
            rgba(255,70,0,.25),
            rgba(255,0,180,.18)
        );

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    box-shadow:
        0 0 35px
        rgba(255,70,0,.35);

    font-size: 16px;
    font-weight: 800;

    letter-spacing: 2px;
}


/* =====================================================
   HALL OVERLAY

   COMPLETELY INVISIBLE INITIALLY
===================================================== */

#hall {

    position: fixed;
    inset: 0;

    z-index: 5;

    display: flex;

    flex-direction: column;
    align-items: center;

    overflow: hidden;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 3s ease;
}


/*
   Activated after 6 seconds
*/

#hall.active {

    opacity: 1;

    pointer-events: auto;
}


/* =====================================================
   GLASS AMBIENT BACKGROUND
===================================================== */

.hallBackground {

    position: absolute;
    inset: 0;

    z-index: -10;

    background:

        radial-gradient(
            circle at 50% 20%,
            rgba(255,80,0,.20),
            transparent 42%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(255,0,180,.13),
            transparent 40%
        );

    opacity: 0;

    transition:
        opacity 4s ease;
}


#hall.active .hallBackground {
    opacity: 1;
}


/* =====================================================
   FLOATING LIGHTS
===================================================== */

.light {

    position: absolute;

    width: 190px;
    height: 190px;

    border-radius: 50%;

    filter: blur(65px);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 4s ease;

    animation:
        floatingLight 8s ease-in-out infinite alternate;
}


#hall.active .light {
    opacity: .35;
}


.light.one {

    left: -90px;
    top: 15%;

    background: #ff4200;
}


.light.two {

    right: -90px;
    top: 48%;

    background: #ff00b7;

    animation-delay: 2s;
}


.light.three {

    left: 30%;
    bottom: -110px;

    background: #00ddff;

    animation-delay: 4s;
}


@keyframes floatingLight {

    from {

        transform:
            translate(0,0)
            scale(.8);
    }

    to {

        transform:
            translate(45px,-45px)
            scale(1.35);
    }
}


/* =====================================================
   HEADER
===================================================== */

.header {

    position: relative;

    flex-shrink: 0;

    width: 100%;

    padding:
        max(20px, env(safe-area-inset-top))
        15px
        10px;

    text-align: center;

    opacity: 0;

    transform:
        translateY(-25px)
        scale(.95);

    transition:
        opacity 2s ease .5s,
        transform 2s ease .5s;
}


#hall.active .header {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* =====================================================
   TITLE
===================================================== */

.title {

    margin: 0;

    font-size:
        clamp(27px, 9vw, 64px);

    font-weight: 1000;

    letter-spacing: 4px;

    background:

        linear-gradient(
            90deg,
            #ff2e00,
            #ffd000,
            #ff5a00,
            #ff00c8,
            #00eaff,
            #ff2e00
        );

    background-size: 400% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        titleGradient 5s linear infinite,
        titleGlow 1.5s ease-in-out infinite alternate;
}


@keyframes titleGradient {

    to {
        background-position: 400% center;
    }
}


@keyframes titleGlow {

    from {

        filter:
            drop-shadow(
                0 0 5px
                rgba(255,70,0,.45)
            );
    }

    to {

        filter:
            drop-shadow(
                0 0 22px
                rgba(255,70,0,1)
            );
    }
}


.subtitle {

    margin-top: 5px;

    color:
        rgba(255,255,255,.72);

    font-size: 10px;

    letter-spacing: 3px;

    text-transform: uppercase;
}


/* =====================================================
   GLASS CONTAINER
===================================================== */

.glass {

    position: relative;

    width: min(94%, 1000px);

    flex: 1;

    min-height: 0;

    margin:
        5px auto 12px;

    border-radius: 28px;

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.22);

    box-shadow:

        0 25px 70px
        rgba(0,0,0,.5),

        inset 0 1px
        rgba(255,255,255,.18);

    backdrop-filter: blur(17px);
    -webkit-backdrop-filter: blur(17px);

    overflow: hidden;

    opacity: 0;

    transform:
        translateY(30px)
        scale(.96);

    transition:
        opacity 3s ease 1s,
        transform 3s cubic-bezier(.2,.8,.2,1) 1s;
}


#hall.active .glass {

    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* =====================================================
   ANIMATED GLASS BORDER
===================================================== */

.glass::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    padding: 1px;

    background:

        linear-gradient(
            120deg,
            transparent,
            #ff4b00,
            transparent,
            #00eaff,
            transparent,
            #ff00b7,
            transparent
        );

    background-size: 400% 400%;

    animation:
        borderMove 7s linear infinite;

    pointer-events: none;

    mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    mask-composite: exclude;

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite: xor;
}


@keyframes borderMove {

    to {
        background-position:
            400% 400%;
    }
}


/* =====================================================
   NAME GRID
===================================================== */

#nameGrid {

    position: absolute;

    inset: 0;

    padding: 13px;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    align-content: start;

    gap: 9px;

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: thin;
}


/* =====================================================
   RESPONSIVE GRID
===================================================== */

@media (min-width: 600px) {

    #nameGrid {

        grid-template-columns:
            repeat(3, minmax(0,1fr));
    }
}


@media (min-width: 900px) {

    #nameGrid {

        grid-template-columns:
            repeat(4, minmax(0,1fr));
    }
}


/* =====================================================
   NAME CARD
===================================================== */

.name {

    min-height: 57px;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 10px;

    border-radius: 16px;

    border:
        1px solid
        rgba(255,255,255,.20);

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,.18),
            rgba(255,255,255,.045)
        );

    font-size:
        clamp(12px,3.5vw,18px);

    font-weight: 800;

    text-align: center;

    text-shadow:
        0 0 7px currentColor,
        0 0 18px currentColor;

    box-shadow:

        inset 0 1px
        rgba(255,255,255,.16),

        0 7px 18px
        rgba(0,0,0,.25);

    opacity: 0;

    transform:
        scale(.45)
        translateY(18px);

    filter: blur(12px);

    animation:
        nameAppear .65s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}


@keyframes nameAppear {

    0% {

        opacity: 0;

        transform:
            scale(.45)
            translateY(18px);

        filter: blur(12px);
    }

    60% {

        opacity: 1;

        transform:
            scale(1.08)
            translateY(-2px);

        filter: blur(0);
    }

    100% {

        opacity: 1;

        transform:
            scale(1)
            translateY(0);

        filter: blur(0);
    }
}


/* =====================================================
   NAME COLORS
===================================================== */

.name:nth-child(5n+1) {
    color: #ffd43b;
}

.name:nth-child(5n+2) {
    color: #ff7043;
}

.name:nth-child(5n+3) {
    color: #ff4bd8;
}

.name:nth-child(5n+4) {
    color: #42e8ff;
}

.name:nth-child(5n+5) {
    color: #9cff63;
}


/* =====================================================
   SCROLLBAR
===================================================== */

#nameGrid::-webkit-scrollbar {
    width: 5px;
}

#nameGrid::-webkit-scrollbar-track {
    background: transparent;
}

#nameGrid::-webkit-scrollbar-thumb {

    background:
        rgba(255,255,255,.35);

    border-radius: 20px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:480px) {

    .glass {

        width: 94%;

        border-radius: 23px;
    }

    #nameGrid {

        padding: 10px;

        gap: 8px;
    }

    .name {

        min-height: 53px;

        border-radius: 14px;
    }
}

</style>
</head>


<body>


<div class="page">


    <!-- =================================================
         BACKGROUND VIDEO
    ================================================== -->

    <video
        id="bgVideo"
        playsinline
        preload="auto"
        src="https://ap095665-boop.github.io/air/587068603_1786301278413516.mp4">
    </video>


    <!-- =================================================
         VIDEO SHADE
    ================================================== -->

    <div class="videoShade"></div>


    <!-- =================================================
         TAP SCREEN
    ================================================== -->

    <div id="startScreen">

        <button
            class="startButton"
            id="startButton">

            🔥 TAP TO ENTER

        </button>

    </div>


    <!-- =================================================
         HALL OF FLAMES
    ================================================== -->

    <section id="hall">


        <div class="hallBackground"></div>


        <div class="light one"></div>
        <div class="light two"></div>
        <div class="light three"></div>


        <header class="header">

            <h1 class="title">
                HALL OF FLAMES
            </h1>

            <div class="subtitle">
                Every name becomes a flame
            </div>

        </header>


        <div class="glass">

            <div id="nameGrid"></div>

        </div>


    </section>

</div>


<script>

/* =====================================================
   YOUR NAMES
===================================================== */

const names = [

    "Amal",
    "Arjun",
    "David",
    "Daniel",
    "Joseph",
    "Michael",
    "Thomas",
    "John",
    "Peter",
    "Samuel",
    "Anthony",
    "Christopher",
    "Matthew",
    "James",
    "Benjamin",
    "Andrew",
    "Joshua",
    "Ryan",
    "Kevin",
    "Alex",
    "George",
    "William",
    "Robert",
    "Edward",
    "Henry",
    "Charles",
    "Oliver",
    "Lucas",
    "Noah",
    "Ethan",
    "Liam",
    "Mason",
    "Jack",
    "Leo",
    "Oscar",
    "Nathan",
    "Adam",
    "Jacob",
    "Isaac"

    /*
       ADD ALL YOUR OTHER NAMES HERE
    */

];


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("bgVideo");

const hall =
    document.getElementById("hall");

const grid =
    document.getElementById("nameGrid");

const shade =
    document.querySelector(".videoShade");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");


/* =====================================================
   SETTINGS
===================================================== */

/*
   SIX SECONDS
*/

const INTRO_TIME = 6000;


/*
   Name reveal speed after
   Hall appears.
*/

const NAME_INTERVAL = 60;


/* =====================================================
   STATE
===================================================== */

let started = false;
let hallShown = false;


/* =====================================================
   CREATE NAME
===================================================== */

function createName(name, index) {

    const card =
        document.createElement("div");

    card.className = "name";

    card.textContent = name;


    /*
       Names appear progressively.
    */

    card.style.animationDelay =
        `${index * NAME_INTERVAL}ms`;


    grid.appendChild(card);
}


/* =====================================================
   SHOW HALL AFTER 6 SECONDS
===================================================== */

function showHall() {

    if (hallShown) return;

    hallShown = true;


    /*
       IMPORTANT:

       DO NOT PAUSE THE VIDEO.

       It continues playing behind
       the Hall of Flames.
    */

    shade.classList.add("active");

    hall.classList.add("active");


    /*
       Start displaying names
       ONLY after the 6-second point.
    */

    names.forEach(
        (name, index) => {

            setTimeout(
                () => {

                    createName(
                        name,
                        index
                    );

                },

                index * NAME_INTERVAL
            );

        }
    );
}


/* =====================================================
   START VIDEO
===================================================== */

function startExperience() {

    if (started) return;

    started = true;

    startScreen.style.display =
        "none";


    /*
       Start video from beginning.
    */

    video.currentTime = 0;


    /*
       NEVER LOOP.
    */

    video.loop = false;


    /*
       SOUND ON.
    */

    video.muted = false;

    video.volume = 1;


    /*
       Play.
    */

    const playPromise =
        video.play();


    if (
        playPromise !== undefined
    ) {

        playPromise.catch(() => {

            /*
               Browser blocked
               autoplay with sound.

               Reset state so user
               can tap.
            */

            started = false;

            startScreen.style.display =
                "flex";

        });

    }


    /*
       Wait exactly 6 seconds.

       Video remains visible.

       Hall remains invisible.

       After 6 seconds,
       Hall fades in over video.
    */

    setTimeout(
        showHall,
        INTRO_TIME
    );
}


/* =====================================================
   TRY AUTOPLAY WITH SOUND
===================================================== */

window.addEventListener(
    "load",
    () => {

        video.muted = false;

        video.volume = 1;

        video.loop = false;

        video.currentTime = 0;


        const promise =
            video.play();


        if (
            promise !== undefined
        ) {

            promise.catch(() => {

                /*
                   Mobile browser has
                   blocked sound autoplay.

                   Show tap button.
                */

                startScreen.style.display =
                    "flex";

            });

        } else {

            /*
               Start 6-second timer
               when autoplay succeeds.
            */

            started = true;

            setTimeout(
                showHall,
                INTRO_TIME
            );

        }

    }
);


/* =====================================================
   TAP TO START
===================================================== */

startButton.addEventListener(
    "click",
    startExperience
);


/* =====================================================
   VIDEO ENDS
===================================================== */

video.addEventListener(
    "ended",
    () => {

        /*
           No looping.

           Hall remains visible.
        */

        video.pause();

    }
);

</script>

</body>
</html>
