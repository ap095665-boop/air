<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Hall of Flames</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
}


/* =====================================================
   PAGE
===================================================== */

.page {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100dvh;

    overflow: hidden;
    background: #000;
}


/* =====================================================
   BACKGROUND VIDEO
===================================================== */

#bgVideo {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    background: #000;

    z-index: 1;

    pointer-events: none;
}


/* =====================================================
   VIDEO SHADE

   Hidden during first 6 seconds.
===================================================== */

.videoShade {
    position: fixed;
    inset: 0;

    z-index: 2;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.15),
            rgba(0,0,0,.58)
        );

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 3s ease;
}

.videoShade.active {
    opacity: 1;
}


/* =====================================================
   AUTOPLAY FALLBACK
===================================================== */

#startScreen {
    position: fixed;
    inset: 0;

    z-index: 200;

    display: none;

    align-items: center;
    justify-content: center;

    background: #000;

    color: #fff;

    text-align: center;
}

.startButton {
    border: 1px solid
        rgba(255,255,255,.3);

    border-radius: 20px;

    padding: 18px 30px;

    color: white;

    background:
        linear-gradient(
            135deg,
            rgba(255,70,0,.28),
            rgba(255,0,180,.18)
        );

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    box-shadow:
        0 0 35px
        rgba(255,70,0,.35);

    font-size: 16px;

    font-weight: 800;

    letter-spacing: 2px;

    cursor: pointer;
}


/* =====================================================
   HALL OVERLAY

   Completely invisible initially.
===================================================== */

#hall {
    position: fixed;
    inset: 0;

    z-index: 5;

    display: flex;

    flex-direction: column;
    align-items: center;

    overflow: hidden;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 3s ease;
}

#hall.active {
    opacity: 1;
    pointer-events: auto;
}


/* =====================================================
   HALL AMBIENT BACKGROUND
===================================================== */

.hallBackground {
    position: absolute;
    inset: 0;

    z-index: -10;

    background:

        radial-gradient(
            circle at 50% 20%,
            rgba(255,80,0,.20),
            transparent 42%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(255,0,180,.13),
            transparent 40%
        );

    opacity: 0;

    transition:
        opacity 4s ease;
}

#hall.active .hallBackground {
    opacity: 1;
}


/* =====================================================
   FLOATING LIGHTS
===================================================== */

.light {
    position: absolute;

    width: 190px;
    height: 190px;

    border-radius: 50%;

    filter: blur(65px);

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 4s ease;

    animation:
        floatingLight 8s ease-in-out infinite alternate;
}

#hall.active .light {
    opacity: .35;
}

.light.one {
    left: -90px;
    top: 15%;

    background: #ff4200;
}

.light.two {
    right: -90px;
    top: 48%;

    background: #ff00b7;

    animation-delay: 2s;
}

.light.three {
    left: 30%;
    bottom: -110px;

    background: #00ddff;

    animation-delay: 4s;
}

@keyframes floatingLight {

    from {
        transform:
            translate(0,0)
            scale(.8);
    }

    to {
        transform:
            translate(45px,-45px)
            scale(1.35);
    }
}


/* =====================================================
   HEADER
===================================================== */

.header {
    position: relative;

    flex-shrink: 0;

    width: 100%;

    padding:
        max(20px, env(safe-area-inset-top))
        15px
        10px;

    text-align: center;

    opacity: 0;

    transform:
        translateY(-25px)
        scale(.95);

    transition:
        opacity 2s ease .5s,
        transform 2s ease .5s;
}

#hall.active .header {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* =====================================================
   TITLE
===================================================== */

.title {
    margin: 0;

    font-size:
        clamp(27px, 9vw, 64px);

    font-weight: 1000;

    letter-spacing: 4px;

    background:
        linear-gradient(
            90deg,
            #ff2e00,
            #ffd000,
            #ff5a00,
            #ff00c8,
            #00eaff,
            #ff2e00
        );

    background-size: 400% auto;

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;

    animation:
        titleGradient 5s linear infinite,
        titleGlow 1.5s ease-in-out infinite alternate;
}

@keyframes titleGradient {
    to {
        background-position: 400% center;
    }
}

@keyframes titleGlow {

    from {
        filter:
            drop-shadow(
                0 0 5px
                rgba(255,70,0,.45)
            );
    }

    to {
        filter:
            drop-shadow(
                0 0 22px
                rgba(255,70,0,1)
            );
    }
}

.subtitle {
    margin-top: 5px;

    color:
        rgba(255,255,255,.72);

    font-size: 10px;

    letter-spacing: 3px;

    text-transform: uppercase;
}


/* =====================================================
   GLASS CONTAINER
===================================================== */

.glass {
    position: relative;

    width: min(94%, 1000px);

    flex: 1;

    min-height: 0;

    margin:
        5px auto 12px;

    border-radius: 28px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.15),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.22);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.5),

        inset 0 1px
        rgba(255,255,255,.18);

    backdrop-filter: blur(17px);
    -webkit-backdrop-filter: blur(17px);

    overflow: hidden;

    opacity: 0;

    transform:
        translateY(30px)
        scale(.96);

    transition:
        opacity 3s ease 1s,
        transform 3s cubic-bezier(.2,.8,.2,1) 1s;
}

#hall.active .glass {
    opacity: 1;

    transform:
        translateY(0)
        scale(1);
}


/* =====================================================
   GLASS BORDER
===================================================== */

.glass::before {
    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    padding: 1px;

    background:
        linear-gradient(
            120deg,
            transparent,
            #ff4b00,
            transparent,
            #00eaff,
            transparent,
            #ff00b7,
            transparent
        );

    background-size: 400% 400%;

    animation:
        borderMove 7s linear infinite;

    pointer-events: none;

    mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    mask-composite: exclude;

    -webkit-mask:
        linear-gradient(#000 0 0) content-box,
        linear-gradient(#000 0 0);

    -webkit-mask-composite: xor;
}

@keyframes borderMove {

    to {
        background-position:
            400% 400%;
    }
}


/* =====================================================
   NAME GRID
===================================================== */

#nameGrid {
    position: absolute;

    inset: 0;

    padding: 13px;

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    align-content: start;

    gap: 9px;

    overflow-y: auto;

    overflow-x: hidden;

    -webkit-overflow-scrolling: touch;

    scrollbar-width: thin;
}


/* =====================================================
   RESPONSIVE GRID
===================================================== */

@media (min-width: 600px) {

    #nameGrid {
        grid-template-columns:
            repeat(3, minmax(0,1fr));
    }
}

@media (min-width: 900px) {

    #nameGrid {
        grid-template-columns:
            repeat(4, minmax(0,1fr));
    }
}


/* =====================================================
   NAME CARD
===================================================== */

.name {
    min-height: 57px;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 10px;

    border-radius: 16px;

    border:
        1px solid
        rgba(255,255,255,.20);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.18),
            rgba(255,255,255,.045)
        );

    font-size:
        clamp(12px,3.5vw,18px);

    font-weight: 800;

    text-align: center;

    text-shadow:
        0 0 7px currentColor,
        0 0 18px currentColor;

    box-shadow:
        inset 0 1px
        rgba(255,255,255,.16),

        0 7px 18px
        rgba(0,0,0,.25);

    opacity: 0;

    transform:
        scale(.45)
        translateY(18px);

    filter: blur(12px);

    animation:
        nameAppear .65s
        cubic-bezier(.2,.8,.2,1)
        forwards;
}

@keyframes nameAppear {

    0% {
        opacity: 0;

        transform:
            scale(.45)
            translateY(18px);

        filter: blur(12px);
    }

    60% {
        opacity: 1;

        transform:
            scale(1.08)
            translateY(-2px);

        filter: blur(0);
    }

    100% {
        opacity: 1;

        transform:
            scale(1)
            translateY(0);

        filter: blur(0);
    }
}


/* =====================================================
   COLOURFUL NAMES
===================================================== */

.name:nth-child(5n+1) {
    color: #ffd43b;
}

.name:nth-child(5n+2) {
    color: #ff7043;
}

.name:nth-child(5n+3) {
    color: #ff4bd8;
}

.name:nth-child(5n+4) {
    color: #42e8ff;
}

.name:nth-child(5n+5) {
    color: #9cff63;
}


/* =====================================================
   SUPPORTER BUTTON
===================================================== */

.supporter {
    grid-column: 1 / -1;

    width: 100%;

    min-height: 82px;

    margin-top: 10px;
    margin-bottom: 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 13px;

    padding: 15px;

    border-radius: 20px;

    border:
        1px solid
        rgba(255,190,70,.5);

    background:
        linear-gradient(
            135deg,
            rgba(255,90,0,.30),
            rgba(255,0,170,.20),
            rgba(0,190,255,.12)
        );

    color: white;

    box-shadow:
        0 0 30px
        rgba(255,70,0,.25),

        inset 0 1px
        rgba(255,255,255,.2);

    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);

    cursor: pointer;

    opacity: 0;

    transform:
        translateY(25px)
        scale(.94);

    animation:
        supporterAppear .8s
        ease forwards;

    animation-delay: 0.3s;
}

.supporter:active {
    transform: scale(.96);
}

.supporter-fire {
    font-size: 30px;

    filter:
        drop-shadow(
            0 0 10px
            rgba(255,120,0,.8)
        );
}

.supporter-text {
    text-align: left;
}

.supporter-text strong {
    display: block;

    font-size:
        clamp(13px,4vw,18px);

    font-weight: 900;
}

.supporter-text small {
    display: block;

    margin-top: 4px;

    color: #ffd66b;

    font-size: 10px;

    letter-spacing: 2px;

    text-transform: uppercase;
}

.supporter-arrow {
    margin-left: auto;

    font-size: 26px;

    color: #ffd43b;

    transition:
        transform .25s ease;
}

.supporter:hover .supporter-arrow {
    transform: translateX(5px);
}

@keyframes supporterAppear {

    from {
        opacity: 0;

        transform:
            translateY(25px)
            scale(.94);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   SCROLLBAR
===================================================== */

#nameGrid::-webkit-scrollbar {
    width: 5px;
}

#nameGrid::-webkit-scrollbar-track {
    background: transparent;
}

#nameGrid::-webkit-scrollbar-thumb {
    background:
        rgba(255,255,255,.35);

    border-radius: 20px;
}


/* =====================================================
   SUPPORTER MODAL
===================================================== */

#supporterModal {

    position: fixed;

    inset: 0;

    z-index: 300;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background:
        rgba(0,0,0,.70);

    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    transition:
        opacity .3s ease;
}

#supporterModal.show {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}

.modalBox {

    width: min(92vw, 430px);

    padding: 25px;

    border-radius: 25px;

    border:
        1px solid
        rgba(255,255,255,.22);

    background:
        linear-gradient(
            135deg,
            rgba(30,15,10,.92),
            rgba(15,10,25,.94)
        );

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.65);

    text-align: center;
}

.modalFire {
    font-size: 42px;
}

.modalBox h2 {

    margin:
        8px 0;

    color: white;

    font-size: 24px;
}

.modalBox p {

    color:
        rgba(255,255,255,.7);

    font-size: 13px;

    line-height: 1.5;
}

.nameInput {

    width: 100%;

    padding: 14px;

    border-radius: 13px;

    border:
        1px solid
        rgba(255,255,255,.2);

    outline: none;

    background:
        rgba(255,255,255,.08);

    color: white;

    font-size: 15px;

    text-align: center;
}

.nameInput::placeholder {
    color:
        rgba(255,255,255,.45);
}

.modalActions {

    display: flex;

    gap: 10px;

    margin-top: 15px;
}

.modalActions button {

    flex: 1;

    padding: 13px;

    border-radius: 13px;

    border: 1px solid
        rgba(255,255,255,.18);

    font-weight: 800;

    cursor: pointer;
}

.cancelBtn {

    color: white;

    background:
        rgba(255,255,255,.08);
}

.continueBtn {

    color: white;

    background:
        linear-gradient(
            135deg,
            #ff4b00,
            #ff008c
        );
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:480px) {

    .glass {

        width: 94%;

        border-radius: 23px;
    }

    #nameGrid {

        padding: 10px;

        gap: 8px;
    }

    .name {

        min-height: 53px;

        border-radius: 14px;
    }

    .supporter {

        min-height: 76px;

        border-radius: 17px;
    }
}

</style>
</head>


<body>


<div class="page">


    <!-- =================================================
         BACKGROUND VIDEO

         0–6 SECONDS:
         THIS IS THE ONLY VISIBLE ELEMENT
    ================================================== -->

    <video
        id="bgVideo"
        playsinline
        preload="auto"
        src="https://ap095665-boop.github.io/air/587068603_1786301278413516.mp4">
    </video>


    <!-- =================================================
         VIDEO SHADE
    ================================================== -->

    <div class="videoShade"></div>


    <!-- =================================================
         AUTOPLAY FALLBACK
    ================================================== -->

    <div id="startScreen">

        <button
            class="startButton"
            id="startButton">

            🔥 TAP TO ENTER

        </button>

    </div>


    <!-- =================================================
         HALL OF FLAMES
    ================================================== -->

    <section id="hall">


        <div class="hallBackground"></div>

        <div class="light one"></div>
        <div class="light two"></div>
        <div class="light three"></div>


        <!-- HEADER -->

        <header class="header">

            <h1 class="title">
                HALL OF FLAMES
            </h1>

            <div class="subtitle">
                Every name becomes a flame
            </div>

        </header>


        <!-- GLASS -->

        <div class="glass">

            <div id="nameGrid"></div>

        </div>


    </section>


    <!-- =================================================
         SUPPORTER MODAL
    ================================================== -->

    <div id="supporterModal">

        <div class="modalBox">

            <div class="modalFire">
                🔥
            </div>

            <h2>
                Become a Supporter
            </h2>

            <p>
                Add your name to the
                Hall of Flames and become
                part of the supporter community.
            </p>

            <input
                id="supporterName"
                class="nameInput"
                type="text"
                maxlength="40"
                placeholder="Enter your name">

            <div class="modalActions">

                <button
                    class="cancelBtn"
                    onclick="closeSupporter()">

                    Cancel

                </button>

                <button
                    class="continueBtn"
                    onclick="continueSupporter()">

                    Continue

                </button>

            </div>

        </div>

    </div>


</div>


<script>

/* =====================================================
   YOUR NAMES
===================================================== */

const names = [

    "Amal",
    "Arjun",
    "David",
    "Daniel",
    "Joseph",
    "Michael",
    "Thomas",
    "John",
    "Peter",
    "Samuel",
    "Anthony",
    "Christopher",
    "Matthew",
    "James",
    "Benjamin",
    "Andrew",
    "Joshua",
    "Ryan",
    "Kevin",
    "Alex",
    "George",
    "William",
    "Robert",
    "Edward",
    "Henry",
    "Charles",
    "Oliver",
    "Lucas",
    "Noah",
    "Ethan",
    "Liam",
    "Mason",
    "Jack",
    "Leo",
    "Oscar",
    "Nathan",
    "Adam",
    "Jacob",
    "Isaac"

    /*
       ADD YOUR COMPLETE NAME LIST HERE.
    */

];


/* =====================================================
   ELEMENTS
===================================================== */

const video =
    document.getElementById("bgVideo");

const hall =
    document.getElementById("hall");

const grid =
    document.getElementById("nameGrid");

const shade =
    document.querySelector(".videoShade");

const startScreen =
    document.getElementById("startScreen");

const startButton =
    document.getElementById("startButton");

const supporterModal =
    document.getElementById("supporterModal");

const supporterName =
    document.getElementById("supporterName");


/* =====================================================
   SETTINGS
===================================================== */

/*
   FIRST PHASE:
   6 SECONDS
*/

const INTRO_TIME = 6000;


/*
   NAME INTERVAL:
   0.06 SECOND
*/

const NAME_INTERVAL = 60;


/* =====================================================
   STATE
===================================================== */

let started = false;

let hallShown = false;


/* =====================================================
   CREATE NAME CARD
===================================================== */

function createName(name, index) {

    const card =
        document.createElement("div");

    card.className = "name";

    card.textContent = name;

    /*
       The name's animation starts
       at its own reveal time.
    */

    card.style.animationDelay = "0ms";

    grid.appendChild(card);

}


/* =====================================================
   SHOW HALL
===================================================== */

function showHall() {

    if (hallShown) return;

    hallShown = true;


    /*
       IMPORTANT:
       VIDEO IS NOT PAUSED.

       It continues playing behind
       the Hall of Flames.
    */

    shade.classList.add("active");

    hall.classList.add("active");


    /*
       Reveal names every 60ms.
    */

    names.forEach(
        (name, index) => {

            setTimeout(
                () => {

                    createName(
                        name,
                        index
                    );

                },

                index * NAME_INTERVAL
            );

        }
    );


    /*
       Add supporter button AFTER
       the final name.
    */

    const supporterDelay =
        names.length * NAME_INTERVAL;


    setTimeout(
        createSupporterButton,
        supporterDelay
    );

}


/* =====================================================
   CREATE SUPPORTER BUTTON
===================================================== */

function createSupporterButton() {

    const button =
        document.createElement("button");

    button.className =
        "supporter";


    button.innerHTML = `

        <span class="supporter-fire">
            🔥
        </span>

        <span class="supporter-text">

            <strong>
                Add Your Name Here
            </strong>

            <small>
                Become a Supporter
            </small>

        </span>

        <span class="supporter-arrow">
            →
        </span>

    `;


    button.onclick =
        openSupporter;


    grid.appendChild(button);

}


/* =====================================================
   START EXPERIENCE
===================================================== */

function startExperience() {

    if (started) return;

    started = true;

    startScreen.style.display =
        "none";


    /*
       Start from beginning.
    */

    video.currentTime = 0;


    /*
       Never loop.
    */

    video.loop = false;


    /*
       Sound ON.
    */

    video.muted = false;

    video.volume = 1;


    /*
       Start playback.
    */

    video.play()
        .then(() => {

            /*
               Video has successfully
               started.

               NOW begin the exact
               6-second timer.
            */

            setTimeout(
                showHall,
                INTRO_TIME
            );

        })
        .catch(() => {

            /*
               Browser blocked autoplay
               with sound.

               Allow the user to tap.
            */

            started = false;

            startScreen.style.display =
                "flex";

        });

}


/* =====================================================
   INITIAL AUTOPLAY ATTEMPT
===================================================== */

window.addEventListener(
    "load",
    () => {

        video.muted = false;

        video.volume = 1;

        video.loop = false;

        video.currentTime = 0;


        video.play()
            .then(() => {

                /*
                   Autoplay with sound
                   was allowed.
                */

                started = true;

                setTimeout(
                    showHall,
                    INTRO_TIME
                );

            })
            .catch(() => {

                /*
                   Browser requires
                   user interaction.
                */

                startScreen.style.display =
                    "flex";

            });

    }
);


/* =====================================================
   TAP TO START
===================================================== */

startButton.addEventListener(
    "click",
    startExperience
);


/* =====================================================
   VIDEO ENDS
===================================================== */

video.addEventListener(
    "ended",
    () => {

        /*
           No loop.

           Hall remains visible.
        */

        video.pause();

    }
);


/* =====================================================
   SUPPORTER
===================================================== */

function openSupporter() {

    supporterModal.classList.add(
        "show"
    );

    setTimeout(
        () => supporterName.focus(),
        200
    );
}


function closeSupporter() {

    supporterModal.classList.remove(
        "show"
    );

}


/*
   This currently demonstrates
   the supporter flow.

   Connect this function to
   your payment/form/backend later.
*/

function continueSupporter() {

    const name =
        supporterName.value.trim();


    if (!name) {

        supporterName.focus();

        return;
    }


    alert(
        "Thank you, " +
        name +
        "! Your supporter submission can be connected here."
    );


    closeSupporter();

    supporterName.value = "";

}
